    entitlements:
      path: WoodlandsEats/WoodlandsEats.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.compofelice.WoodlandsEats
        # v1.7 (Feature B): Sign in with Apple. Layered ON TOP of the
        # existing iCloud/CloudKit identity — does NOT replace
        # userRecordID as the primary key for placements/visited/profile.
        # SIWA pre-fills the user's display name with their Apple-
        # verified real name (one tap vs typing) and provides a stable
        # cross-device identifier for future friend-sharing.
        com.apple.developer.applesignin:
          - Default
        # v1.7 (Feature C): Universal Links for friend-tier sharing.
        # Share URLs: https://compo-cf.github.io/woodlands-eats/tier/<userID>
        # AASA file (manual setup on Compo-CF.github.io repo) goes at:
        #   https://compo-cf.github.io/.well-known/apple-app-site-association
        # Payload:
        #   { "applinks": { "details": [{
        #       "appIDs": ["7H5T5AR2X5.com.compofelice.WoodlandsEats"],
        #       "components": [{ "/" : "/woodlands-eats/tier/*" }]
        #   }] } }
        com.apple.developer.associated-domains:
          - applinks:compo-cf.github.io
        # v1.9: Push Notifications. CloudKit delivers CKQuerySubscription
        # alerts through APNs, which requires this entitlement. Value is
        # "development" in the committed entitlements file; Xcode's
        # automatic signing promotes it to the production APNs environment
        # for distribution (TestFlight/App Store) archives.
        # ⚠ VERIFY on the first TestFlight build that pushes actually
        # arrive — if not, the aps-environment likely needs to be forced
        # to "production" here.
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: WoodlandsEats
        PRODUCT_BUNDLE_IDENTIFIER: com.compofelice.WoodlandsEats
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # CODE_SIGNING handled per-config (none in CI, manual on submit day)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7H5T5AR2X5
