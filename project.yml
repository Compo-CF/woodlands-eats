    entitlements:
      path: WoodlandsEats/WoodlandsEats.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.compofelice.WoodlandsEats
    settings:
      base:
        PRODUCT_NAME: WoodlandsEats
        PRODUCT_BUNDLE_IDENTIFIER: com.compofelice.WoodlandsEats
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # CODE_SIGNING handled per-config (none in CI, manual on submit day)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7H5T5AR2X5
