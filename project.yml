# XcodeGen project spec.
# Generates WoodlandsEats.xcodeproj from this YAML.
# Run `xcodegen generate` on any Mac (or in CI) to (re)create the project.
# Why XcodeGen: keeps the project file out of git, lets you edit on Windows
# without breaking pbxproj checksums, and makes CI trivial.

name: WoodlandsEats

options:
  bundleIdPrefix: com.compofelice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # v1.1: Google Mobile Ads SDK for AdMob banner integration.
  # Pinned to a major; minor updates auto-pulled.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Silences the "Traditional headermap style is no longer supported" warning
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  WoodlandsEats:
    type: application
    platform: iOS
    sources:
      - path: WoodlandsEats
        excludes:
          - "Info.plist"
    dependencies:
      # v1.1: AdMob SDK for banner ads on the Browse tab.
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: WoodlandsEats/Info.plist
      properties:
        CFBundleDisplayName: S-Tier Eats
        CFBundleShortVersionString: "2.4"
        CFBundleVersion: "82"
        CFBundleIconName: AppIcon
        # v2.1: register the stier:// custom URL scheme so friend-tier deep
        # links resolve even when Universal Links don't (the web 404 page's
        # "open in app" fallback uses stier://tier/<id>). parseFriendTierID
        # in WoodlandsEatsApp already handles this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: com.compofelice.WoodlandsEats.tier
            CFBundleURLSchemes:
              - stier
        # v1.9: remote-notification background mode so CloudKit can wake
        # the app for its push-subscription deliveries.
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: Used to show restaurants near you and sort by distance.
        # v2.2 (AdMob revenue): App Tracking Transparency. Shown after an
        # in-app priming step; granting it lets AdMob serve higher-CPM
        # personalized ads, which helps keep the app free.
        NSUserTrackingUsageDescription: Allow tracking to show more relevant ads, which helps keep S-Tier Eats free.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        ITSAppUsesNonExemptEncryption: false
        # v1.1: AdMob app ID for S-Tier Eats. Registered standalone in the
        # AdMob console (separate from the Woodlands Fishing app) because
        # AdMob server-side binds ad-unit IDs to the registered app's bundle
        # ID at request time. Sharing Fishing's IDs caused no-fill responses
        # on build 20; this is the same-publisher / separate-app fix.
        GADApplicationIdentifier: ca-app-pub-1927040492403163~4102398702
        # SKAdNetwork IDs for the major ad networks the SDK reports to.
        # Apple requires these to be declared so attribution can flow without IDFA.
        # Source: Google's published list for SDK 11.x.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
